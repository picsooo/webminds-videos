name: publish-social
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths: ["publisher/posts.json"]
permissions:
  contents: write
concurrency:
  group: publish-social
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python3 publisher/publish.py
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - run: |
          git config user.name "picsooo"; git config user.email "wsaoudi705@gmail.com"
          git add publisher/state.json 2>/dev/null || true
          git commit -m "publisher: état des publications" || exit 0
          git pull --rebase -q && git push
