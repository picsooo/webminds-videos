name: fetch-images
on:
  push:
    paths: ["requests/*.json"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in requests/*.json; do
            b=$(basename "$f" .json)
            if [ -d "stock/$b" ]; then continue; fi
            mkdir -p "stock/$b"
            python3 tools/fetch_images.py "$b" "$(python3 -c "import json;print(json.load(open('$f'))['source'])")" "$(python3 -c "import json;print(json.dumps(json.load(open('$f'))['spec']))")" > "stock/$b/log.txt" 2>&1 || true
          done
        env:
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      - run: |
          git config user.name "picsooo"; git config user.email "wsaoudi705@gmail.com"
          git add stock && git commit -m "stock images" && git pull --rebase && git push || echo "nothing to commit"
